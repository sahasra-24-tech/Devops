<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Registration Form</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.1/dist/css/bootstrap.min.css">
</head>
<body>
    <div class="container">
        <h2>User Registration</h2>
        <form action="{{url_for('register')}}" method="post">
            {% if mesage is defined and mesage %}
            <div class="alert alert-warning">
                {{mesage}}
            </div>
            {% endif %}
            <div class="form-group">
                <label for="name">Name:</label>
                <input type="text" class="form-control" id="name" name="name" placeholder="Enter Name">
            </div>
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" name="email"  class="form-control" placeholder="Enter Email" id="emai">
                <label for="pwd">password:</label>
                <input type="password" placeholder="Enter password" name="pswd">
            </div>
            <button type="submit" class="btn btn-primary">Register</button>
            <p class="bottom">Already have an account?<a href="{{url_for('login')}}">Login Here</a></p>
        </form>
    </div>
</body>
</html>
